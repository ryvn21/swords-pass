# Builds the Windows app (an installer and a portable .exe) whenever desktop/ changes on main,
# or from the Actions tab, and publishes them as a GitHub release (Releases, right-hand side of the repo).
# The app opens the live site, so game updates reach it without rebuilding this.
name: Desktop app
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['desktop/**', '.github/workflows/desktop.yml']
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx electron-builder --win nsis portable --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: swords-pass-windows
          path: desktop/release/*.exe
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-v1.0.${{ github.run_number }}
          name: Sword's Pass for Windows (build ${{ github.run_number }})
          body: Download SwordsPass-Setup to install, or the portable .exe to run without installing. The app always opens the latest version of the game.
          files: desktop/release/*.exe
