<!doctype html><html><head><meta charset="utf-8"><title>Sword's Pass</title>
<style>html,body{height:100%;margin:0;background:#0f0a08;color:#f5e8c8;font:16px system-ui,sans-serif;display:grid;place-items:center;text-align:center}
img{width:256px;image-rendering:pixelated}button{margin-top:18px;font:inherit;padding:8px 22px;background:#7d1b20;color:#f5e8c8;border:2px solid #d4a24c;cursor:pointer}p{color:#c9b28c;max-width:420px}</style></head>
<body><div><img src="build/icon.png" alt=""><h1>Can't reach the tavern</h1><p>Check your connection. If the server has been asleep it can take up to a minute to wake.</p><button id="retry">Try again</button></div>
<script>const site=new URLSearchParams(location.search).get('site');document.getElementById('retry').onclick=()=>location.href=site;setTimeout(()=>location.href=site,30000);</script></body></html>
